<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿一覧 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>社内つぶやきボード</h1>
    <nav>
        <a th:href="@{/posts}">一覧</a>
    </nav>
    <section class="post-form">
        <form th:action="@{/posts/create}" th:object="${postForm}" method="post">
            <div>
                <label for="author">投稿者</label>
                <input type="text" id="author" th:field="*{author}" maxlength="30" required>
                <p class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">エラー</p>
            </div>
            <div>
                <label for="content">内容 (280 文字まで)</label>
                <textarea id="content" th:field="*{content}" maxlength="280" rows="4" required></textarea>
                <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">エラー</p>
            </div>
            <button type="submit">投稿</button>
        </form>
    </section>
    <form class="refresh-form" th:action="@{/posts/}" method="get">
        <button type="submit">更新</button>
    </form>

    <section>
        <p th:if="${#lists.isEmpty(posts)}">まだ投稿はありません</p>
        <article class="post" th:each="post : ${posts}">
            <header>
                <span class="post__author" th:text="${post.author}">投稿者</span>
            </header>
            <p class="post__body" th:text="${post.body}">本文</p>
            <time class="post__created-at"
                  th:datetime="${post.createdAt}"
                  th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
        </article>
    </section>
</main>
</body>
</html>
