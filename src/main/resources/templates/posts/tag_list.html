<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|#${tagName} の投稿 - 社内つぶやきボード|">タグ別投稿 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1 th:text="|#${tagName} の投稿|">#タグ の投稿</h1>
    <nav>
        <a th:href="@{/posts}">一覧</a>
        <a th:href="@{/posts/new}">新規投稿</a>
    </nav>

    <section>
        <p th:if="${#lists.isEmpty(posts)}">まだ投稿はありません</p>
        <a class="post-card" th:each="post : ${posts}" th:href="@{/posts/{id}(id=${post.id})}">
            <article class="post">
                <header class="post__header">
                    <span class="post__avatar" th:style="|background-color: ${post.avatarColor}|"></span>
                    <span class="post__author" th:text="${post.author}">投稿者</span>
                </header>
                <p class="post__body" th:text="${post.body}">本文</p>
                <time class="post__created-at"
                      th:datetime="${post.createdAt}"
                      th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">2026-05-23 09:00</time>
            </article>
        </a>
    </section>
</main>
</body>
</html>
