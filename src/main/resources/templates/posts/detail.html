<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>投稿詳細 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>投稿詳細</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
    </nav>

    <article class="post">
        <header class="post__header">
            <span class="post__avatar" th:style="|background-color: ${post.avatarColor}|"></span>
            <span class="post__author" th:text="${post.author}">投稿者</span>
        </header>
        <p class="post__body" th:text="${post.body}">本文</p>
        <time class="post__created-at"
              th:datetime="${post.createdAt}"
              th:text="${#temporals.format(post.createdAt, 'yyyy/MM/dd HH:mm:ss')}">
            2026/05/23 09:00:00
        </time>
        <footer class="post__actions">
            <span class="post__like-count">
                <span th:text="${likeSummary.count}">0</span>いいね
            </span>
            <form method="post" th:action="@{/posts/{id}/likes(id=${post.id})}">
                <button type="submit"
                        class="like-button"
                        th:classappend="${likeSummary.liked} ? ' like-button--liked' : ''"
                        th:text="${likeSummary.liked} ? 'いいね済み' : 'いいね'">
                    いいね
                </button>
            </form>
            <form method="post" th:action="@{/posts/{id}/delete(id=${post.id})}">
                <button type="submit" class="delete-button">削除</button>
            </form>
        </footer>
    </article>

    <section class="reply-compose">
        <h2>リプライする</h2>
        <form class="post-form" th:action="@{/posts/{id}/reply(id=${post.id})}"
              th:object="${replyForm}" method="post">
            <input type="hidden" th:if="${_csrf != null}"
                   th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

            <label for="reply-author">投稿者</label>
            <input id="reply-author" type="text" th:field="*{author}" maxlength="30" required>
            <p class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">
                投稿者名エラー
            </p>

            <label for="reply-content">本文</label>
            <textarea id="reply-content" th:field="*{content}" rows="4" maxlength="280" required></textarea>
            <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">
                本文エラー
            </p>

            <label for="reply-avatar-color">アバター色</label>
            <input id="reply-avatar-color" type="color" th:field="*{avatarColor}" required>
            <p class="error" th:if="${#fields.hasErrors('avatarColor')}" th:errors="*{avatarColor}">
                アバター色エラー
            </p>

            <button type="submit">リプライ</button>
        </form>
    </section>

    <section class="reply-list">
        <h2>リプライ一覧</h2>
        <p th:if="${#lists.isEmpty(replies)}">まだリプライはありません</p>
        <article class="post reply" th:each="reply : ${replies}">
            <header class="post__header">
                <span class="post__avatar" th:style="|background-color: ${reply.avatarColor}|"></span>
                <span class="post__author" th:text="${reply.author}">投稿者</span>
            </header>
            <p class="post__body" th:text="${reply.body}">返信本文</p>
            <time class="post__created-at"
                  th:datetime="${reply.createdAt}"
                  th:text="${#temporals.format(reply.createdAt, 'yyyy/MM/dd HH:mm:ss')}">
                2026/05/23 09:01:00
            </time>
        </article>
    </section>
</main>
</body>
</html>
