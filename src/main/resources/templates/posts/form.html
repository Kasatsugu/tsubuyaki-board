<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>新規投稿 - 社内つぶやきボード</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<main>
    <h1>新規投稿</h1>
    <nav>
        <a th:href="@{/posts}">一覧に戻る</a>
    </nav>

    <form th:action="@{/posts/create}" th:object="${postForm}" method="post">
        <div>
            <label for="author">投稿者</label>
            <input type="text" id="author" th:field="*{author}" maxlength="30" required>
            <p class="error" th:if="${#fields.hasErrors('author')}" th:errors="*{author}">エラー</p>
        </div>
        <div>
            <label for="avatarColor">アバター色</label>
            <input class="post-form__color" type="color" id="avatarColor" th:field="*{avatarColor}" value="#888888">
            <p class="error" th:if="${#fields.hasErrors('avatarColor')}" th:errors="*{avatarColor}">エラー</p>
        </div>
        <div>
            <label for="content">内容 (280 文字まで)</label>
            <textarea id="content" th:field="*{content}" maxlength="280" rows="4" required></textarea>
            <p class="error" th:if="${#fields.hasErrors('content')}" th:errors="*{content}">エラー</p>
        </div>
        <button type="submit">投稿</button>
    </form>
</main>
</body>
</html>
